spring.application.name=labourlinkai

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.expiration=${JWT_EXPIRATION:36000000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional OpenAI-compatible chat provider. Leave the API key empty to use the
# built-in LabourLinkAI guidance fallback. Keep credentials server-side only.
app.chat.api-key=${CHAT_API_KEY:}
app.chat.api-url=${CHAT_API_URL:https://api.openai.com/v1/chat/completions}
app.chat.model=${CHAT_MODEL:gpt-4o-mini}
